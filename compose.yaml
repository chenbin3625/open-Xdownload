services:
  x-archive:
    image: chenbin3625/x-archive:edge
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    command:
      - x-archive
      - --bind
      - 0.0.0.0:3000
      - --password
      - "" # 填写自己的访问密码，至少 12 位。
      - --data-dir
      - /app/data
      - --config-dir
      - /app/config
    volumes:
      - archive-data:/app/data
      - archive-config:/app/config
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
volumes:
  archive-data:
  archive-config:
