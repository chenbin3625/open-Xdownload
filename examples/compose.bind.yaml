# Set the password below before starting in a dedicated deployment directory.
# Existing data/config contents must be writable by UID/GID 10001.
services:
  x-archive:
    image: chenbin3625/x-archive:edge
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    command:
      - x-archive
      - --bind
      - 0.0.0.0:3000
      - --password
      - "" # Set your own password of at least 12 characters.
      - --data-dir
      - /app/data
      - --config-dir
      - /app/config
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
