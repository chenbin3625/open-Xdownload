name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      # The web unit tests were previously never executed in CI.
      - name: Test web
        run: npm --prefix apps/web run test

      - name: Build web
        run: npm run build

      - name: Sync embedded web assets
        run: npm run sync:web

      - name: Test Go
        run: go test ./...

      - name: Build server
        run: CGO_ENABLED=0 go build -trimpath -o dist/open-xdownload ./cmd/server
