name: Docker Hub image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source tag or branch to build (empty uses the workflow ref)
        type: string
        required: false
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ inputs.source_ref || github.ref }}'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: x-archive:test
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Verify startup, permissions, authentication and persistence
        run: node scripts/verify-container.mjs x-archive:test ${{ matrix.arch }}

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ inputs.source_ref || github.ref }}'
      - name: Record source revision
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: chenbin3625/x-archive
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.source_ref || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.source_ref || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.source_ref || github.ref_name }},enable=${{ !startsWith(inputs.source_ref || github.ref_name, 'v0.') }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}
            type=raw,value=edge,enable=${{ (inputs.source_ref || github.ref_name) == 'main' }}
            type=raw,value=latest,enable=${{ startsWith(inputs.source_ref || github.ref_name, 'v') && !contains(inputs.source_ref || github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: '${{ steps.meta.outputs.tags }}'
          labels: '${{ steps.meta.outputs.labels }}'
          cache-from: |
            type=gha,scope=image-amd64
            type=gha,scope=image-arm64
            type=gha,scope=image-multi
          cache-to: type=gha,scope=image-multi,mode=max
