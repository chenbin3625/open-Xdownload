name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: open-xdownload

jobs:
  # The embedded Web UI used to be rebuilt inside every matrix leg (six identical
  # installs and builds). It is now built once and handed to the matrix as an artifact.
  frontend:
    name: Build embedded web assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Build embedded web assets
        run: npm run build:embedded

      - name: Package web assets
        run: tar -czf open-xdownload-webui.tar.gz -C internal/webui dist

      - name: Upload web assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Deliberately not named open-xdownload-*: the release job downloads
          # every open-xdownload-* artifact, and this build input must never be
          # published as a release asset.
          name: web-assets
          path: open-xdownload-webui.tar.gz
          if-no-files-found: error

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            ext: ".exe"
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download web assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: web-assets

      - name: Extract web assets
        run: |
          # Extract into a clean directory: the repository ships a committed
          # internal/webui/dist and a merge would keep stale hashed bundles embedded.
          rm -rf internal/webui/dist
          tar -xzf open-xdownload-webui.tar.gz -C internal/webui

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist/package
          version="${GITHUB_REF_NAME:-dev}"
          commit="${GITHUB_SHA}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${version} -X main.commit=${commit} -X main.date=${date}" \
            -o "dist/package/${APP_NAME}${{ matrix.ext }}" ./cmd/server
          cp README.md dist/package/

      - name: Package tar.gz
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          archive="dist/${APP_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "$archive" -C dist/package .
          sha256sum "$archive" | sed 's#dist/##' > "${archive}.sha256"

      - name: Package zip
        if: matrix.archive == 'zip'
        run: |
          set -euo pipefail
          archive="dist/${APP_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          (cd dist/package && zip -r "../$(basename "$archive")" .)
          sha256sum "$archive" | sed 's#dist/##' > "${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}
            dist/${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          # Only the per-platform archives; without the pattern the web-assets
          # build input is downloaded too and ends up in the release.
          pattern: open-xdownload-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
